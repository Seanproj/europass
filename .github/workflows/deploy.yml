name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        if: hashFiles('package.json') != ''
        with:
          node-version: 22
          cache: npm

      # v1: Vite 빌드 결과(dist/) 배포 / v0: 저장소 루트를 그대로 배포
      - name: Build site
        id: site
        run: |
          if [ -f package.json ]; then
            npm ci
            npm run build
            echo "dir=dist" >> "$GITHUB_OUTPUT"
          else
            mkdir -p _site
            cp -r index.html manifest.webmanifest sw.js css js assets vendor _site/
            echo "dir=_site" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: ${{ steps.site.outputs.dir }}

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
